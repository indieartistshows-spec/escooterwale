<style>
.brand-video{position:relative;background:#000;aspect-ratio:16/9;max-height:78vh;width:100%;overflow:hidden}
.brand-video .bv-poster,.brand-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.brand-video iframe{opacity:0;transition:opacity .6s;pointer-events:none;transform:scale(1.02)}
.brand-video.playing iframe{opacity:1}
.brand-video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55) 100%);pointer-events:none}
.bv-logo{position:absolute;top:20px;left:20px;z-index:2;display:flex;align-items:center;gap:12px;color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.bv-sound{position:absolute;right:18px;bottom:18px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:10px 16px;font:700 14px var(--f);cursor:pointer;min-height:44px;backdrop-filter:blur(6px)}
.bv-credit{position:absolute;left:20px;bottom:20px;z-index:2;color:rgba(255,255,255,.75);font-size:12px;max-width:60%}
.brand-hero.has-video .brand-hero-bg,.brand-hero.has-video .brand-logo-big{display:none}
.brand-hero.has-video .brand-hero-content{grid-template-columns:1fr;padding:32px 0 34px}
@media(max-width:640px){.brand-video{aspect-ratio:4/3}.bv-logo{top:14px;left:14px;font-size:15px}.bv-sound{right:12px;bottom:12px;padding:8px 13px;font-size:13px}.bv-credit{display:none}}
/* ── BRAND HERO ─────────────────────────────────────────── */
.brand-hero{
  padding:0;position:relative;overflow:hidden;
  background:var(--ink)
}
.brand-hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:.18;
  -webkit-mask:linear-gradient(to bottom,rgba(0,0,0,1) 0%,rgba(0,0,0,0) 100%);
  mask:linear-gradient(to bottom,rgba(0,0,0,1) 0%,rgba(0,0,0,0) 100%)
}
.brand-hero-content{
  position:relative;z-index:1;
  padding:52px 0 48px;
  display:grid;grid-template-columns:auto 1fr;
  gap:32px;align-items:center
}
/* The big logo circle */
.brand-logo-big{
  width:96px;height:96px;border-radius:22px;
  overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,255,255,.08), 0 8px 32px rgba(0,0,0,.4)
}
.brand-logo-big img{
  width:100%;height:100%;object-fit:contain;display:block
}
.brand-hero-text{}
.bh-eyebrow{
  font-size:10px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--g);margin-bottom:8px
}
.brand-hero h1{
  color:#fff;margin-bottom:10px;
  font-size:clamp(24px,3.5vw,40px);line-height:1.1
}
.brand-hero p{color:rgba(255,255,255,.5);font-size:14px;max-width:560px;line-height:1.7}
/* Stats row */
.brand-stats{
  display:flex;gap:0;margin-top:28px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;overflow:hidden;
  max-width:480px
}
.bs{
  flex:1;padding:14px 16px;text-align:center;
  border-right:1px solid rgba(255,255,255,.07)
}
.bs:last-child{border-right:none}
.bs-num{font-size:22px;font-weight:900;color:var(--g);line-height:1}
.bs-lbl{font-size:9px;color:rgba(255,255,255,.35);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
/* Brand action bar */
.brand-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
/* About card */
.brand-about-card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:20px;padding:28px;margin-bottom:24px;
  box-shadow:0 2px 12px rgba(0,0,0,.05)
}
/* Score card */
.brand-score-card{
  background:var(--ink);border-radius:20px;
  padding:24px;margin-bottom:24px
}
.bsc-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:16px}
/* Responsive */
@media(max-width:640px){
  .brand-hero-content{grid-template-columns:1fr;gap:20px;padding:36px 0 32px}
  .brand-top-grid{grid-template-columns:1fr}
  .brand-logo-big{width:72px;height:72px}
  .brand-stats{max-width:100%}
  .bs-num{font-size:18px}
}
</style>

<body>
<div id="navMount"></div>
<div class="page-wrap">

<div class="brand-video" id="brandVideo" hidden></div>
<div class="brand-hero" id="brandHero">
  <div class="brand-hero-bg" id="brandHeroBg"></div>
  <div class="container">
    <div class="brand-hero-content">
      <!-- Left: big logo -->
      <div class="brand-logo-big" id="brandLogoBox"></div>
      <!-- Right: text -->
      <div class="brand-hero-text">
        <div class="bh-eyebrow" id="bsHQ">India · EV Brand</div>
        <h1 id="brandHeroTitle">Ola Electric</h1>
        <p id="brandHeroDesc">India's largest EV company by sales.</p>
        <div class="brand-stats">
          <div class="bs"><div class="bs-num" id="bsModels">6</div><div class="bs-lbl">Models</div></div>
          <div class="bs"><div class="bs-num" id="bsFrom">₹99,999</div><div class="bs-lbl">From</div></div>
          <div class="bs"><div class="bs-num" id="bsRating">4.3★</div><div class="bs-lbl">Avg ScootScore</div></div>
          <div class="bs"><div class="bs-num" id="bsFounded">2017</div><div class="bs-lbl">Founded</div></div>
        </div>
        <div class="brand-actions">
          <a href="#" id="brandWebsiteLink" target="_blank" rel="noopener">
            <button class="btn btn-primary">Visit official site ↗</button>
          </a>
          <a href="/compare"><button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.2)">Compare models</button></a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="breadcrumb"><div class="container"><div class="breadcrumb-inner"><a href="/">Home</a><span class="bc-sep">›</span><a href="/listings">Electric Scooters</a><span class="bc-sep">›</span><span id="bcBrand">Ola Electric</span></div></div></div>

<div class="container" style="padding:32px 20px 64px">
  <div class="grid-2 brand-top-grid" style="gap:24px;margin-bottom:32px;align-items:start">
    <div>
      <div class="brand-about-card">
        <div class="eyebrow mb-8">About the brand</div>
        <p id="brandAbout" style="font-size:15px;line-height:1.8;color:var(--ink-2)"></p>
        <div class="mt-16" style="display:flex;gap:10px">
          <a href="/listings" ><button class="btn btn-outline">All EV scooters</button></a>
        </div>
      </div>
    </div>
    <div class="brand-score-card">
      <div class="bsc-label">Brand scorecard</div>
      <div id="brandScores"></div>
    </div>
  </div>

  <div class="sec-hd"><div><div class="eyebrow" id="modelsEyebrow">All models</div><h2 class="mt-8" id="modelsTitle">Ola Electric scooters 2026</h2></div></div>
  <div class="grid-3" id="brandModelsGrid"></div>

  <div style="margin-top:40px">
    <div class="sec-hd"><div><div class="eyebrow">Compare all brands</div><h2 class="mt-8">Browse other EV brands in India</h2></div></div>
    <div class="brand-strip" id="otherBrandsStrip"></div>
  </div>
</div>

<div id="footerMount"></div>
<div id="compareTrayMount"></div>
</div>

<script src="data.js?v=cfac69f4"></script>
<script src="seo.js?v=5e2f83ba"></script>
<script src="outbound.js?v=f73b042f"></script>
<script src="components.js?v=29cc6b56"></script>
<script>
document.getElementById('navMount').innerHTML=navHTML('');
document.getElementById('footerMount').innerHTML=footerHTML();
document.getElementById('compareTrayMount').innerHTML=compareTrayHTML();

const bid=window.__SW_BRAND__||new URLSearchParams(location.search).get('b')||'ola-electric';
const brand=BRANDS_DB.find(b=>b.id===bid)||BRANDS_DB[0];
const models=SCOOTERS_DB.filter(s=>s.brandSlug===bid);
const minPrice=models.length?Math.min(...models.map(s=>s.price)):0;
const avgRating=models.length?(models.reduce((a,s)=>a+s.score,0)/models.length).toFixed(1):0;

const _seo=SEO.brand(brand,models);
document.getElementById('pgTitle').textContent=_seo.title;
document.getElementById('pgDesc').setAttribute('content',_seo.desc);
document.getElementById('pgCanon').setAttribute('href',`https://www.escooterwale.in/brands/${bid}`);
// Hero background: use first scooter image
if(models[0]?.heroImg) document.getElementById('brandHeroBg').style.backgroundImage=`url('${models[0].heroImg}')`;

// Video banner: the brand's own film plays muted (browsers block sound on autoplay), one tap for sound
(function(){
  const v=(typeof BRAND_VIDEOS!=='undefined'&&BRAND_VIDEOS[bid])||null, box=document.getElementById('brandVideo');
  if(!v||!box) return;
  box.hidden=false;document.getElementById('brandHero').classList.add('has-video');
  box.innerHTML=`<img class="bv-poster" src="https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'" alt="${brand.name}" fetchpriority="high"/>
    <div class="bv-logo">${brandLogoHTML(bid,52)}<span translate="no">${brand.name}</span></div>
    <span class="bv-credit" translate="no">${v.title}</span>
    <button class="bv-sound" type="button" aria-pressed="false"><span class="bv-ic">🔇</span> <span class="bv-tx">Tap for sound</span></button><span hidden>Mute</span>`;
  const start=()=>{
    if(navigator.webdriver) return; // the build's page renderer should not bake a player into the static page
    const f=document.createElement('iframe');
    f.title=v.title;f.allow='autoplay; encrypted-media; picture-in-picture';f.setAttribute('allowfullscreen','');
    f.src=`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&mute=1&loop=1&playlist=${v.id}&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
    f.addEventListener('load',()=>setTimeout(()=>box.classList.add('playing'),700));
    box.insertBefore(f,box.children[1]);
    let muted=true;const b=box.querySelector('.bv-sound');
    b.addEventListener('click',()=>{muted=!muted;
      f.contentWindow&&f.contentWindow.postMessage(JSON.stringify({event:'command',func:muted?'mute':'unMute',args:[]}),'*');
      if(!muted) f.contentWindow&&f.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}),'*');
      b.setAttribute('aria-pressed',String(!muted));b.querySelector('.bv-ic').textContent=muted?'🔇':'🔊';b.querySelector('.bv-tx').textContent=muted?'Tap for sound':'Mute';
      try{gtag('event','brand_video_sound',{brand:bid,on:!muted})}catch(e){}
    });
  };
  // the video loads after the page, so the poster is what counts for speed
  if(document.readyState==='complete') setTimeout(start,300); else addEventListener('load',()=>setTimeout(start,300));
})();

// Big logo — use brandLogoHTML at 96px
const logoBox=document.getElementById('brandLogoBox');
logoBox.innerHTML=brandLogoHTML(bid,96);
// After rendering, override border-radius on the img inside
logoBox.style.borderRadius='22px';

// Text
document.getElementById('bsHQ').textContent=(brand.hq||'India')+' · '+brand.founded;
document.getElementById('brandHeroTitle').textContent=brand.name;
document.getElementById('brandHeroDesc').textContent=brand.about;
document.getElementById('bsModels').textContent=models.length||brand.models;
document.getElementById('bsFrom').textContent=minPrice?'₹'+minPrice.toLocaleString('en-IN'):'—';
document.getElementById('bsRating').textContent=avgRating+'/10';
document.getElementById('bsFounded').textContent=brand.founded;
document.getElementById('bcBrand').textContent=brand.name;
document.getElementById('brandAbout').textContent=brand.about;
document.getElementById('brandWebsiteLink').href=brand.website;
document.getElementById('modelsEyebrow').textContent=`${models.length} models available`;
document.getElementById('modelsTitle').textContent=`${brand.name} scooters 2026`;

// Brand scores — compute from actual model data
const scoreKeys=['Range','Features','Value','Ride','Service'];
const sc={};
scoreKeys.forEach(k=>{
  const vals=models.filter(s=>s.scores&&s.scores[k]!==undefined).map(s=>s.scores[k]);
  sc[k]=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'7.0';
});
document.getElementById('brandScores').innerHTML=Object.entries(sc).map(([k,v])=>`
  <div style="display:grid;grid-template-columns:64px 1fr 30px;align-items:center;gap:10px;margin-bottom:10px">
    <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.04em">${k}</span>
    <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden">
      <div style="height:100%;border-radius:3px;background:var(--g);width:${+v*10}%;transition:width 1s ease"></div>
    </div>
    <span style="font-size:12px;font-weight:800;color:rgba(255,255,255,.7);text-align:right">${v}</span>
  </div>`).join('');

// Models grid
document.getElementById('brandModelsGrid').innerHTML=models.length
  ?models.map(s=>scooterCardHTML(s)).join('')
  :`<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--ink-3)"><div style="font-size:40px;margin-bottom:12px">🔍</div><p>No models found for this brand yet. Check back soon.</p></div>`;

// Other brands — use brandLogoHTML
document.getElementById('otherBrandsStrip').innerHTML=BRANDS_DB.filter(b=>b.id!==bid).map(b=>`
  <a href="/brands/${b.id}" class="brand-chip">
    ${brandLogoHTML(b.id,52)}
    <div class="brand-chip-name">${b.name.split(' ')[0]}</div>
    <div class="brand-chip-count">${b.models} models</div>
  </a>`).join('');
</script>
</body>
</html>
