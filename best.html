      {id:'ampere-magnus-g-max-3point0-kwh', why:"{real} of real range for {price}, sold and serviced through Greaves Ampere's wide network.", whoFor:"Budget buyers in smaller cities who put service access first."}
    ],
    finalRec:{
      text:"In a Tier-2 or Tier-3 city, buy the <strong>TVS iQube ST</strong> if the budget allows. If it does not, the <strong>Ampere Nexus ST</strong> gives you a modern scooter with one of the widest dealer networks in the country.",
      scooterA:'tvs-motor-iqube-st-5point3-kwh', scooterB:'ampere-nexus-st-3-kwh'
    }
  }
};

/* Fill {tokens} in pick copy from live data, so prices and ranges
   in the text update by themselves every week. */
function fillTok(str, s) {
  if (!s) return str;
  const span = v => String(v || '').replace(/\s*[–—-]\s*/g, ' to ');
  return String(str)
    .replace(/\{price\}/g, s.priceDisplay).replace(/\{real\}/g, span(s.realRange))
    .replace(/\{claimed\}/g, s.range).replace(/\{speed\}/g, s.speed)
    .replace(/\{charge\}/g, s.charging).replace(/\{boot\}/g, s.bootSpace);
}

/* Picks that no longer fit the category (price above the cap, model
   removed) drop out and the rest are renumbered. Best-range re-sorts
   by the lower end of real-world range. */
function livePicks(cat) {
  const low = s => parseFloat(String(s.realRange).match(/\d+/)) || 0;
  let list = cat.picks.map(p => ({ p, s: SCOOTERS_DB.find(x => x.id === p.id) })).filter(x => x.s);
  if (cat.cap) list = list.filter(x => x.s.price < cat.cap);
  if (cat.sortByRealRange) list.sort((a, b) => low(b.s) - low(a.s));
  // budget lists: when prices move and fewer than 5 hand picks still fit, the best-scoring
  // full-speed scooters under the cap fill the gaps (one per model family)
  if (cat.cap && list.length < 5) {
    const fam = s => s.brandSlug + '|' + s.name.replace(/\s*[\d.]+\s*kWh$/i, '');
    const have = new Set(list.map(x => fam(x.s)));
    const extra = SCOOTERS_DB.filter(s => s.price < cat.cap && (parseFloat(s.speed) || 0) > 25 && !have.has(fam(s)))
      .sort((a, b) => b.score - a.score || a.price - b.price);
    for (const s of extra) { if (list.length >= 5) break; if (have.has(fam(s))) continue; have.add(fam(s));
      list.push({ p: { id: s.id, why: '{price} ex-showroom with {real} of real range, a {speed} top speed and a {boot} boot.', whoFor: `Buyers who want a registered, full-speed electric scooter under ${cat.cap === 100000 ? '₹1 lakh' : '₹1.5 lakh'}.` }, s }); }
  }
  return list.map((x, i) => Object.assign({}, x.p, { rank: i + 1 }));
}

const CAT_ORDER = ['daily-commute','under-1-5l','under-1-lakh','family','best-range','tier2-cities'];

/* ── RENDER ─────────────────────────────────────────────── */
function renderPage(catSlug) {
  const cat0 = CATEGORIES[catSlug] || CATEGORIES['daily-commute'];
  const cat = Object.assign({}, cat0, { picks: livePicks(cat0) });
  const seo = SEO.best(cat, cat.picks.map(p => SCOOTERS_DB.find(s => s.id === p.id)));

  // Update SEO
  document.getElementById('pgTitle').textContent = seo.title;
  document.getElementById('pgDesc').setAttribute('content', seo.desc);
  document.getElementById('pgCanon').setAttribute('href', `https://www.escooterwale.in/best/${catSlug}`);
  document.getElementById('ogTitle').setAttribute('content', seo.title.replace(' | EScooterwale',''));
  document.getElementById('pgH1').textContent = cat.title;
  document.getElementById('pgSubtitle').textContent = cat.subtitle;

  // JSON-LD
  const ex = document.querySelector('script[type="application/ld+json"]');if(ex)ex.remove();
  const ld = document.createElement('script');ld.type='application/ld+json';
  const picks = cat.picks.map(p=>SCOOTERS_DB.find(s=>s.id===p.id)).filter(Boolean);
  ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"ItemList","name":seo.title.replace(' | EScooterwale',''),"itemListElement":picks.map((s,i)=>({
    "@type":"ListItem","position":i+1,"name":s.fullName,"url":`https://www.escooterwale.in/scooters/${s.id}`
  }))});
  document.head.appendChild(ld);

  // Active tab
  document.querySelectorAll('.cat-link').forEach(l => {
    l.classList.toggle('active', l.dataset.cat === catSlug);
  });

  // Direct answers for the searches that land here ("which electric scooter is best in india",
  // "top 10 electric scooter in india with price", "lowest price electric scooter", "under 1 lakh")
  const byPrice = [...SCOOTERS_DB].sort((a, b) => a.price - b.price), fullSpeed = byPrice.filter(s => (parseFloat(s.speed) || 0) > 25);
  const span = v => String(v || '').replace(/\s*[–—-]\s*/g, ' to ');
  let answer = '';
  if (IS_ROOT) {
    const fam = s => s.brandSlug + '|' + s.name.replace(/\s*[\d.]+\s*kWh$/i, ''), seenF = new Set();
    const top10 = [...SCOOTERS_DB].sort((a, b) => b.score - a.score || a.price - b.price).filter(s => { if (seenF.has(fam(s))) return false; seenF.add(fam(s)); return true; }).slice(0, 10);
    const u1 = livePicks(CATEGORIES['under-1-lakh'])[0], rg = livePicks(CATEGORIES['best-range'])[0];
    const u1s = u1 && SCOOTERS_DB.find(s => s.id === u1.id), rgs = rg && SCOOTERS_DB.find(s => s.id === rg.id);
    answer = `<section class="sw-answer"><h2>Which electric scooter is best in India?</h2><p>On our ScootScore, the best electric scooter in India in 2026 is the <strong>${top10[0].fullName}</strong> (${top10[0].score}/10, ${top10[0].priceDisplay}).${u1s ? ` Under ₹1 lakh, our pick is the ${u1s.fullName} at ${u1s.priceDisplay}.` : ''}${rgs ? ` For the longest real range, the ${rgs.fullName} (${span(rgs.realRange)}).` : ''} The cheapest full-speed electric scooter is the ${fullSpeed[0].fullName} at ${fullSpeed[0].priceDisplay}.</p>
      <h2 style="margin-top:16px">Top 10 electric scooters in India with price</h2>
      <div class="lu-scroll"><table class="lu-t"><thead><tr><th>#</th><th>Scooter</th><th>Price</th><th>Real range</th><th>Top speed</th><th>ScootScore</th></tr></thead><tbody>
      ${top10.map((s, i) => `<tr><td>${i + 1}</td><td><a href="/scooters/${s.id}" translate="no">${s.fullName}</a></td><td>${s.priceDisplay}</td><td>${span(s.realRange)}</td><td>${s.speed}</td><td>${s.score}/10</td></tr>`).join('')}
      </tbody></table></div></section>`;
    window.__TOP10__ = top10;
  } else if (cat.cap) {
    const under = SCOOTERS_DB.filter(s => s.price < cat.cap), underFull = under.filter(s => (parseFloat(s.speed) || 0) > 25);
    const capTxt = cat.cap === 100000 ? '₹1 lakh' : '₹1.5 lakh', first = cat.picks[0] && SCOOTERS_DB.find(s => s.id === cat.picks[0].id);
    answer = `<section class="sw-answer"><h2>Best and cheapest electric scooter under ${capTxt}</h2><p>${under.length} electric scooters cost under ${capTxt} ex-showroom, ${underFull.length} of them full-speed and registered.${first ? ` Our top pick is the <strong>${first.fullName}</strong> at ${first.priceDisplay}.` : ''} The lowest price electric scooter in India is the ${byPrice[0].fullName} at ${byPrice[0].priceDisplay}${(parseFloat(byPrice[0].speed) || 0) <= 25 ? ' (a 25 km/h low-speed model)' : ''}, and the cheapest full-speed one is the ${fullSpeed[0].fullName} at ${fullSpeed[0].priceDisplay}.</p></section>`;
  }

  // Intro
  document.getElementById('introBlock').innerHTML = answer + `
    <div class="intro-block">
      <h2>${cat.label}: Our Top ${cat.picks.length} Picks</h2>
      <div style="font-size:15px;color:var(--ink-2);line-height:1.7">${cat.intro}</div>
      <div class="intro-bottom">
        <div class="intro-stat"><div class="intro-stat-num">${cat.picks.length}</div><div class="intro-stat-label">Scooters ranked</div></div>
        <div class="intro-stat"><div class="intro-stat-num">${new Date(SW_CONFIG.dataUpdated).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div><div class="intro-stat-label">Prices updated</div></div>
        <div class="intro-stat"><div class="intro-stat-num">100%</div><div class="intro-stat-label">Independent picks</div></div>
      </div>
    </div>`;

  // Ranked cards
  document.getElementById('rankedList').innerHTML = cat.picks.map(pick => {
    const s = SCOOTERS_DB.find(x => x.id === pick.id);
    if (!s) return '';
    return `
    <div class="ranked-card rank-${pick.rank}">
      <div class="rank-num">#${pick.rank}</div>
      <div class="ranked-img">
        <img src="${s.cardImg}" alt="${s.brand} ${s.name} review India" loading="lazy" onerror="this.style.display='none'"/>
      </div>
      <div class="ranked-body">
        <div>
          <div class="ranked-brand">${s.brand}</div>
          <div class="ranked-name">${s.name}</div>
          <div class="ranked-price">${s.priceDisplay} <span style="font-size:13px;font-weight:500;color:var(--ink-3)">ex-showroom</span></div>
        </div>
        <div class="ranked-why">${fillTok(pick.why, s)}</div>
        <div class="ranked-specs">
          <span class="rspec">${s.realRange} real range</span>
          <span class="rspec">${s.speed}</span>
          <span class="rspec">${s.bootSpace} boot</span>
          <span class="rspec">${s.charging} charge</span>
        </div>
        <div class="who-tag">
          <strong>Who it's for</strong>
          ${fillTok(pick.whoFor, s)}
        </div>
        <div class="ranked-actions">
          <a href="/scooters/${s.id}"><button class="btn btn-outline" style="font-size:13px">Full review →</button></a>
          <a href="${s.brandUrl}" target="_blank" rel="noopener noreferrer"><button class="btn btn-primary" style="font-size:13px">Buy on ${s.brand} ↗</button></a>
          <a href="/compare?a=${s.id}&b=${cat.picks.find(p=>p.rank===1)?.id===s.id?(cat.picks[1]?.id||s.id):cat.picks[0]?.id}">
            <button class="btn btn-ghost" style="font-size:13px">Compare →</button>
          </a>
        </div>
      </div>
    </div>`;
  }).join('');

  // Final rec
  const recA = SCOOTERS_DB.find(s => s.id === cat.finalRec.scooterA);
  const recB = SCOOTERS_DB.find(s => s.id === cat.finalRec.scooterB);
  document.getElementById('finalRec').innerHTML = `
    <div class="final-rec">
      <h3>Our Final Recommendation</h3>
      <p>${cat.finalRec.text}</p>
      <div class="final-rec-row">
        ${recA ? `<a href="${recA.brandUrl}" target="_blank" rel="noopener noreferrer"><button class="btn btn-primary btn-lg">${recA.brand} ${recA.name} ↗</button></a>` : ''}
        ${recB ? `<a href="${recB.brandUrl}" target="_blank" rel="noopener noreferrer"><button class="btn" style="background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.25);padding:12px 24px;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer">${recB.brand} ${recB.name} ↗</button></a>` : ''}
        <a href="/compare?a=${cat.finalRec.scooterA}&b=${cat.finalRec.scooterB}"><button class="btn" style="background:transparent;color:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.2);padding:12px 24px;border-radius:var(--r-sm);font-size:15px;font-weight:600;cursor:pointer">Compare these two →</button></a>
      </div>
    </div>`;

  // More cats
  document.getElementById('moreCats').innerHTML = CAT_ORDER
    .filter(c => c !== catSlug)
    .map(c => {
      const other = CATEGORIES[c];
      return `<a href="/best/${c}" class="more-cat-card">
        ${other.icon?`<div class="mc-icon">${other.icon}</div>`:''}
        <div class="mc-title">${other.label}</div>
        <div class="mc-sub">Top ${Object.keys(CATEGORIES[c].picks||{}).length||5} picks for ${other.label.toLowerCase()}</div>
      </a>`;
    }).join('');
}

/* ── INIT ───────────────────────────────────────────────── */
document.getElementById('navMount').innerHTML = navHTML('');
document.getElementById('footerMount').innerHTML = footerHTML();
document.getElementById('compareTrayMount').innerHTML = compareTrayHTML();

// Build category nav
document.getElementById('catNav').innerHTML = CAT_ORDER.map(c => {
  const cat = CATEGORIES[c];
  return `<button class="cat-link" data-cat="${c}" onclick="switchCat('${c}')">${cat.icon?cat.icon+' ':''}${cat.label}</button>`;
}).join('');

function switchCat(slug) {
  renderPage(slug);
  if(!window.__SW_CAT__) history.replaceState({}, '', `${location.pathname.match(/^\/(hi|mr|ta|te|kn|gu|bn|or)\//)?location.pathname.match(/^\/[a-z]{2}/)[0]:''}/best/${slug}`);
}

const p = new URLSearchParams(location.search);
renderPage(window.__SW_CAT__ || p.get('cat') || 'daily-commute');
// /best itself: overall best and top 10 list on top, with its own title and canonical
if (IS_ROOT) {
  const t = 'Best Electric Scooters in India 2026: Top 10 With Price | EScooterwale';
  document.getElementById('pgTitle').textContent = t;
  document.getElementById('ogTitle').setAttribute('content', t.replace(' | EScooterwale', ''));
  document.getElementById('pgCanon').setAttribute('href', 'https://www.escooterwale.in/best');
  document.getElementById('pgH1').textContent = 'Best Electric Scooters in India 2026';
  const top = window.__TOP10__ || [];
  if (top.length) document.getElementById('pgDesc').setAttribute('content', `Which electric scooter is best in India? Our top 10 for 2026 with price, led by the ${top[0].fullName}. Real range, ScootScore and picks for commuting, families and under ₹1 lakh.`);
  const ld = document.querySelector('script[type="application/ld+json"]');
  if (ld && top.length) ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'ItemList', name: 'Top 10 electric scooters in India 2026', itemListElement: top.map((s, i) => ({ '@type': 'ListItem', position: i + 1, name: s.fullName, url: `https://www.escooterwale.in/scooters/${s.id}` })) });
}
