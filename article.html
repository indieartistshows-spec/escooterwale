const ARTICLES={
  'ola-s1-pro-review':{
    tag:'Long-term Review',img:(SCOOTERS_DB.find(s=>s.id==='ola-electric-s1-pro-4-kwh')||{}).heroImg||'/images/hero-scooter.webp',
    title:'Ola S1 Pro Gen 2 after 10,000 km: The honest verdict on India\'s best-selling EV scooter',
    date:'Apr 6, 2026',readTime:'8 min read',
    scooters:['ola-electric-s1-pro-4-kwh'],
    content:`<p>The Ola S1 Pro Gen 2 is the scooter that changed what Indian buyers expect from a two-wheeler. When we started this long-term test twelve months ago, we wanted to find out what happens after the honeymoon period — after the software novelty wears off, after the first service appointment, and after 10,000 km of real Indian roads.</p>
    <h2>What we love after 10,000 km</h2>
    <p>The <strong>7-inch touchscreen</strong> running MoveOS 4 remains genuinely excellent. Google Maps integration is the best in this class — it reroutes in real time, handles Indian road data well, and the display is bright enough to read in direct Pune afternoon sun. We've received <strong>six OTA updates</strong> in the past year, each adding meaningful features like trip planning and improved regenerative braking curves.</p>
    <p>The <strong>36-litre boot</strong> continues to be the S1 Pro's killer advantage. In 12 months of commuting, we never once had to carry a bag because the boot couldn't fit something. Full-face helmet, laptop bag, grocery run — it swallows everything. No other electric scooter comes close.</p>
    <blockquote>"The Ola S1 Pro has genuinely replaced our household's petrol scooter. We don't miss the petrol scooter at all — and we've saved approximately ₹42,000 in fuel over 10,000 km." — Our test rider, Bengaluru</blockquote>
    <p>Range holds up well. In city conditions with two riders and Normal mode, we averaged <strong>135–141 km per charge</strong> consistently. Eco mode regularly delivers 155+ km. These numbers don't degrade over time — battery capacity has remained within 3% of day-one figures.</p>
    <h2>What we don't love</h2>
    <p>The <strong>service experience</strong> remains the S1 Pro's most significant weakness. Our first service appointment in Bengaluru took three weeks — we waited nearly two hours at the experience centre before even being seen. The second service was faster (same-day), and by the third, the system had improved noticeably. But a premium scooter at ₹1.5 lakh on-road should not have service wait times of more than a week.</p>
    <p>The <strong>touchscreen-only interface</strong continues to divide opinion. There are no physical buttons for volume, hazard lights, or even horn access without touching the screen. In Mumbai's rains, with gloves on, this becomes genuinely dangerous. Ola has promised physical buttons in future software updates, but 12 months later, they haven't appeared.</p>
    <div class="callout"><h4>Our tip after 12 months</h4><p>Carry the Ola fast charger in the boot. A mid-day 30-minute charge at an Ola Hypercharger point gives you an extra 60–70 km. This makes range anxiety completely disappear for most users.</p></div>
    <h2>Verdict: Still the best, but with caveats</h2>
    <p>After 10,000 km, the Ola S1 Pro Gen 2 remains India's best electric scooter on paper. The range, the boot, the features — nothing else matches it. But 'best on paper' and 'best ownership experience' are different things, and the gap between them is Ola's service network. If you live in a city with a good Ola Experience Centre, buy it without hesitation. If you don't, read the Ather 450X review first.</p>
    <div class="verdict-inline"><div class="eyebrow">EScooterwale Verdict</div><p>India's most capable EV scooter. Buy it if you're in a metro. Think twice if you're not.</p></div>`
  },
  'fame-3-guide':{
    tag:'Buying Guide',img:(NEWS_DB.find(n=>n.id==='fame-3-guide')||{}).img||'/images/hero-scooter.webp',
    title:'FAME-III subsidy 2025: Complete guide to claiming your ₹10,000+',
    date:'Apr 3, 2026',readTime:'5 min read',
    scooters:['ola-electric-s1-pro-4-kwh','ather-energy-450x-3point7-kwh','ola-electric-s1-x-3-kwh'],
    content:`<h2>What is FAME-III?</h2><p>FAME stands for Faster Adoption and Manufacturing of (Hybrid &) Electric Vehicles. FAME-III is the Indian government's third phase of EV subsidy programme, under the National Electric Mobility Mission Plan. It provides a direct purchase incentive for certified electric vehicles, deducted at the point of sale.</p>
    <h2>How much subsidy will I get?</h2><p>Under FAME-III, electric scooters receive a subsidy of <strong>₹10,000 per kWh of battery capacity</strong>, capped at 15% of the vehicle's cost. For most EV scooters with 2.5–5 kWh batteries, this means effective subsidies of <strong>₹10,000–25,000</strong>.</p>
    <h2>Which scooters qualify?</h2><p>To qualify for FAME-III, an electric scooter must be manufactured in India (minimum 50% local content), have a maximum speed of at least 40 km/h, and be certified by the testing agency. Currently qualifying scooters include the Ola S1 series, Ather 450 series, TVS iQube, and most Hero Vida models.</p>
    <div class="callout"><h4>How to claim</h4><p>You don't need to claim separately. When buying a qualifying scooter, your dealer should automatically deduct the FAME-III subsidy from the ex-showroom price and show it clearly on your invoice. If they don't, ask explicitly — some dealers may not proactively mention it.</p></div>`
  },
  'ev-running-costs':{
    tag:'Analysis',img:(NEWS_DB.find(n=>n.id==='ev-vs-petrol')||{}).img||'/images/hero-scooter.webp',
    title:'EV vs Petrol scooter: Exact running cost breakdown in 2026',
    date:'Mar 28, 2026',readTime:'6 min read',
    scooters:['ola-electric-s1-pro-4-kwh','ather-energy-450x-3point7-kwh'],
    content:`<h2>The real numbers</h2><p>We calculated running costs for a 50 km/day commuter in Mumbai over 5 years, comparing a petrol scooter (Honda Activa 6G at ₹78,000) versus an electric scooter (Ola S1 Air at ₹99,999 after subsidy).</p>
    <h2>Fuel/energy costs</h2><p>The Honda Activa returns approximately 50 km/litre in city conditions. At ₹105/litre, that's ₹2.10 per km, or <strong>₹3,150/month</strong> for a 50 km/day commuter. The Ola S1 Air consumes approximately 30 Wh/km, costing about ₹0.25/km (at ₹8/unit home charging) — <strong>₹375/month</strong>. Monthly saving: <strong>₹2,775</strong>.</p>
    <h2>Maintenance</h2><p>Petrol scooters require oil changes every 3,000 km, air filter cleaning, spark plug replacement, and chain maintenance. Annual maintenance cost: <strong>₹6,000–9,000</strong>. EV scooters require minimal maintenance — tyre pressure, brake inspection, and a software check. Annual cost: <strong>₹1,200–2,000</strong>.</p>
    <div class="callout"><h4>5-year total cost of ownership</h4><p>EV scooter total (purchase + running): ₹2,85,000. Petrol scooter total: ₹3,44,000. <strong>EV saves ₹59,000 over 5 years</strong> — equivalent to recovering the price difference and more.</p></div>`
  }
};
