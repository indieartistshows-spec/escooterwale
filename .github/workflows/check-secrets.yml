# One-off: tests GA_PROPERTY_ID, GA_SA_KEY, YT_API_KEY and posts the result as an issue. Safe to delete.
name: Check secrets
on:
  push:
    branches: [v2.1-build]
    paths: ['.github/workflows/check-secrets.yml', 'automation/check-secrets.js']
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node automation/check-secrets.js
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: gh issue create --title "Secrets check $(date -u +'%F %H:%M')" --body-file secrets-check.md
        env: { GH_TOKEN: '${{ github.token }}' }
