# Fetch the homepage carousel banners from the brands' own sites.
# Runs when the banner script or config changes, or by hand. The weekly job also refreshes them.
name: Homepage banners

on:
  workflow_dispatch:
  push:
    branches: [v2.1-build, main]
    paths: ['automation/banners.js', '.github/workflows/banners.yml', 'data/launch-features.json']

permissions:
  contents: write

jobs:
  banners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fetch banners
        run: |
          node automation/banners.js
          node automation/banners.js --file=data/launch-features.json
          node tools/banner-clean.js
      - name: Report
        run: cat automation/out/banners.json automation/out/launch-features.json
      - name: Commit
        run: |
          git config user.name "escooterwale-bot"
          git config user.email "bot@escooterwale.in"
          git add images/banners data/banners.json data/launch-features.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Homepage banners refreshed from brand sites"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && break; sleep 10; done
