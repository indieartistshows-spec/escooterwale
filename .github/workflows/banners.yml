# Fetch the homepage carousel banners from the brands' own sites.
# Runs when the banner script or config changes, or by hand. The weekly job also refreshes them.
name: Homepage banners

on:
  workflow_dispatch:
  push:
    branches: [v2.1-build, main]
    paths: ['automation/banners.js', '.github/workflows/banners.yml']

permissions:
  contents: write

jobs:
  banners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fetch banners
        run: node automation/banners.js
      - name: Report
        run: cat automation/out/banners.json
      - name: Commit
        run: |
          git config user.name "escooterwale-bot"
          git config user.email "bot@escooterwale.in"
          git add images/banners data/banners.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Homepage banners refreshed from brand sites"
          git push
