# Runs the Leads sheet clean up (api/leads-cleanup.js on the live site) on demand.
# The nightly run at 11:59 PM IST is a Vercel cron (vercel.json), not this workflow.
# The reply holds counts only, never names or numbers. Pick "dry" to see counts without changing anything.
name: Leads clean up

on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (count only, change nothing)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/leads-cleanup.yml']

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for the latest deployment
        if: github.event_name == 'push'
        run: sleep 120
      - name: Clean up the Leads tab
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: |
          auth=(); [ -n "$CRON_SECRET" ] && auth=(-H "Authorization: Bearer $CRON_SECRET")
          code=$(curl -sS -o reply.json -w '%{http_code}' -m 120 "${auth[@]}" "https://escooterwale.in/api/leads-cleanup?dry=$DRY")
          echo "HTTP $code"; cat reply.json; echo
          { echo "### Leads clean up"; echo; echo '```json'; cat reply.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || { echo "::error::Leads clean up failed (HTTP $code): $(cat reply.json)"; exit 1; }
