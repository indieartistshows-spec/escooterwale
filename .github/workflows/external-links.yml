# Checks every outbound link on the site like a visitor would (automation/external-links.js) and
# commits reports/external-links.json. Run by hand from Actions.
name: External links check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automation/external-links.js', '.github/workflows/external-links.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04   # pinned: Playwright browser deps fail on the new Ubuntu 26 image
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node automation/external-links.js
      - run: |
          git config user.name "escooterwale-bot"
          git config user.email "bot@escooterwale.in"
          git add reports/external-links.json
          git diff --cached --quiet && exit 0
          git commit -m "External links check result"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
